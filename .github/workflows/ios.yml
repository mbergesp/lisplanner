# Compila la app de iOS en un Mac de GitHub (gratis para repositorios privados dentro de la cuota)
# y la arranca en simuladores de iPhone y iPad para sacar capturas.
# Se ejecuta en cada push o a mano desde la pestaña «Actions».
name: iOS

on:
  push:
  workflow_dispatch:

jobs:
  simulador:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Herramientas
        run: |
          chmod +x gradlew
          brew install xcodegen
          xcodebuild -version

      - name: Generar proyecto de Xcode
        working-directory: iosApp
        run: xcodegen generate

      - name: Compilar para el simulador
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Capturas en simulador (iPhone y iPad)
        run: |
          APP=build/ios/Build/Products/Debug-iphonesimulator/LISPlanner.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          mkdir -p capturas
          for KIND in iPhone iPad; do
            UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in rt for d in ds]
          print(next(d['udid'] for d in reversed(devs) if d['name'].startswith('$KIND')))")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" "$BUNDLE"
            sleep 25
            xcrun simctl io "$UDID" screenshot "capturas/$KIND.png"
            xcrun simctl shutdown "$UDID"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: capturas-ios
          path: capturas/

      - uses: actions/upload-artifact@v5
        with:
          name: LISPlanner-simulador
          path: build/ios/Build/Products/Debug-iphonesimulator/LISPlanner.app
